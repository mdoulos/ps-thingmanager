name: Release on merge

# Every push to the release branch (i.e. a merged PR) may bump the version and
# publish a GitHub Release that the in-app "Check for Updates" button can pull.
#
# Versioning is driven by CHANGELOG.md:
#   * Add your notes as "-" bullets under "## Unreleased". On merge, CI stamps
#     them with the next version + date (patch bump by default; put #minor or
#     #major in the merge commit for a larger bump), updates the app version,
#     commits that back, and publishes the release.
#   * Or name the version yourself with a "## vX.Y.Z — YYYY-MM-DD" heading; CI
#     releases exactly that version if it has no tag yet.
# If there is nothing new to release, the run is a no-op.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a specific version, e.g. 1.2.0 (optional)'
        required: false
        default: ''

permissions:
  contents: write   # needed to push the version bump and create the Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to compute the next version

      - name: Decide version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          today=$(date +%Y-%m-%d)
          forced="${{ github.event.inputs.version }}"

          # An "## Unreleased" section counts only if it has at least one bullet.
          unreleased=$(awk '/^## /{f=0} /^## Unreleased[[:space:]]*$/{f=1; next} f' CHANGELOG.md || true)
          has_unreleased=0
          if printf '%s\n' "$unreleased" | grep -qE '^[-*] '; then has_unreleased=1; fi

          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -z "$latest" ]; then
            latest=$(grep -oE '<Version>[0-9]+\.[0-9]+\.[0-9]+' src/PurpleStarNotes.csproj | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          fi

          mode=none
          version=""

          if [ -n "$forced" ]; then
            version="$forced"; mode=explicit
          elif [ "$has_unreleased" = "1" ]; then
            IFS=. read -r MA MI PA <<< "$latest"
            msg=$(git log -1 --pretty=%B)
            bump=patch
            if   printf '%s' "$msg" | grep -qiE '#major'; then bump=major
            elif printf '%s' "$msg" | grep -qiE '#minor'; then bump=minor
            fi
            case "$bump" in
              major) MA=$((MA+1)); MI=0; PA=0;;
              minor) MI=$((MI+1)); PA=0;;
              patch) PA=$((PA+1));;
            esac
            version="$MA.$MI.$PA"; mode=auto
          else
            version=$(grep -m1 -oE '^## v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
            mode=explicit
          fi

          if [ -z "$version" ]; then
            echo "Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Releasing v$version (mode=$mode)."
          {
            echo "release=true"
            echo "version=$version"
            echo "mode=$mode"
            echo "today=$today"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp version into the source
        if: steps.ver.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          today="${{ steps.ver.outputs.today }}"

          # In auto mode, turn "## Unreleased" into the new version heading and
          # leave a fresh, empty "## Unreleased" above it for the next changes.
          if [ "${{ steps.ver.outputs.mode }}" = "auto" ]; then
            awk -v hdr="## v$version — $today" '
              BEGIN{done=0}
              /^## Unreleased[[:space:]]*$/ && !done { print; print ""; print hdr; done=1; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi

          sed -i -E "s|<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>|<Version>$version</Version>|" src/PurpleStarNotes.csproj
          sed -i -E "s|(VersionText.*Text=\")v[0-9.]+(\")|\1v$version\2|" src/MainWindow.xaml
          sed -i -E "s|(#define MyAppVersion \")[0-9.]+(\")|\1$version\2|" installer/PurpleStarNotes.iss

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/PurpleStarNotes.csproj src/MainWindow.xaml installer/PurpleStarNotes.iss
          if ! git diff --cached --quiet; then
            # [skip ci] + the built-in token both prevent this push from re-triggering the workflow.
            git commit -m "Release v$version [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up .NET
        if: steps.ver.outputs.release == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, no .NET needed on user PCs)
        if: steps.ver.outputs.release == 'true'
        run: >
          dotnet publish src/PurpleStarNotes.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Inno Setup
        if: steps.ver.outputs.release == 'true'
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            installer\PurpleStarNotes.iss

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: main   # tag the (possibly just-pushed) tip of main
          files: installer/Output/PurpleStarNotesSetup.exe
          generate_release_notes: true
