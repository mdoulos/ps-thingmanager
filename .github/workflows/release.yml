name: Build and Release

# Push a tag like v1.2.0 to build the installer and publish a GitHub Release
# that the in-app "Check for updates" button can pull. You can also run it
# manually (Actions tab -> Run workflow) to produce a test build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (publishes a Release tagged v<version>)'
        required: true
        default: '1.1.2'

permissions:
  contents: write   # needed to create the Release and its tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (self-contained, no .NET needed on user PCs)
        run: >
          dotnet publish src/PurpleStarNotes.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            installer\PurpleStarNotes.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpleStarNotesSetup
          path: installer/Output/PurpleStarNotesSetup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # Creates this tag at the built commit if it doesn't already exist.
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: installer/Output/PurpleStarNotesSetup.exe
          generate_release_notes: true
